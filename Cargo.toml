[package]
name = "pokemon_sorter"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21.0", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Interface avec les éléments du navigateur
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement"] }